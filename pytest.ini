[pytest]
testpaths = test
asyncio_mode = auto
# A misspelt marker would silently move a test between the tiers.
addopts = --strict-markers
# CI runs the fast tier, -m "not offline"; scripts/agent_check.sh runs everything (see docs/testing.md).
markers =
    offline: real-ROS tests beyond the per-distro smoke (DDS discovery, real time); left out of CI
    ros_graph: spins rclpy nodes against in-process fixture servers
    ui: drives the textual app headless via Pilot (no rclpy)
    e2e: full stack smoke (real bridge + Pilot + fixture servers)
    shots: scenario tests that take named screenshots (written with ROS_TUI_SHOTS=1; see docs/agentic-dev.md)
