# Docker playground for ros_tui. See docs/docker.md.
#
#   docker/create_dot_env            # one-time: capture your UID/GID into .env
#   docker compose up --build        # build the workspace + launch the demo servers
#   docker compose exec ros_tui bash # in a 2nd terminal, then: ros2 run ros_tui ros_tui
services:
  ros_tui:
    # One image per distro and user, shared by every clone and worktree of the repo (the default
    # name would follow the folder). The UID/GID is in the tag because it is baked into the image:
    # a build from a folder without .env makes its own 1000:1000 image instead of replacing yours.
    # The bind mount below is still this folder's source.
    image: ros-tui-dev:${ROS_DISTRO:-jazzy}-${USER_ID:-1000}-${GROUP_ID:-1000}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    # Bind-mount the package source into the workspace; build/install/log stay
    # inside the container, so the host repo stays clean.
    volumes:
      - ./:/ros_tui_ws/src/ros_tui
    working_dir: /ros_tui_ws
    # Keep stdin/tty so the demo logs render and the container stays up.
    stdin_open: true
    tty: true
    environment:
      ROS_DISTRO: ${ROS_DISTRO:-jazzy}
      ROS_DOMAIN_ID: "0"
      # docker exec gives TERM=xterm and no COLORTERM, so Textual drops to 16 ANSI colours and
      # every dark surface in the theme becomes plain black. Ask for truecolor instead.
      TERM: xterm-256color
      COLORTERM: truecolor
    entrypoint: ["/ros_tui_ws/src/ros_tui/docker/entrypoint.sh"]
    # Default: build, then run the example servers. The TUI itself is run
    # interactively in a second terminal via `docker compose exec`.
    command: ["python3", "src/ros_tui/docker/demo_servers.py"]
