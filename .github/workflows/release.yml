# Builds ros_tui.pyz on every push and pull request; on a v* tag, attaches it to the GitHub release.
name: Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pyz:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build ros_tui.pyz
      run: scripts/build_pyz.sh

    - uses: actions/upload-artifact@v4
      with:
        name: ros_tui.pyz
        path: dist/ros_tui.pyz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ pyz ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: ros_tui.pyz

    - name: Attach ros_tui.pyz to the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" ros_tui.pyz --repo "$GITHUB_REPOSITORY" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" ros_tui.pyz --repo "$GITHUB_REPOSITORY" --clobber
