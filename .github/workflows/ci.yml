name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        distro: [ jazzy, lyrical, rolling ]
    # Rolling moves under us; report it, but don't block on it.
    continue-on-error: ${{ matrix.distro == 'rolling' }}
    runs-on: ubuntu-latest
    container:
      image: ros:${{ matrix.distro }}-ros-base

    steps:
    - uses: actions/checkout@v4
      with:
        path: src/ros_tui

    # Everything comes from package.xml through rosdep (textual is bundled, so no pip), plus
    # the screenshot tooling and flake8.
    - name: Install dependencies
      run: |
        apt-get update -qq
        rosdep update --rosdistro ${{ matrix.distro }}
        rosdep install --from-paths src --ignore-src -y --rosdistro ${{ matrix.distro }}
        apt-get install -y --no-install-recommends python3-flake8 librsvg2-bin fonts-jetbrains-mono

    - name: Lint with flake8
      working-directory: src/ros_tui
      run: |
        python3 -m flake8 ros_tui test --count --select=E9,F63,F7,F82 --show-source --statistics
        python3 -m flake8 ros_tui test --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Build
      shell: bash
      run: |
        . /opt/ros/${{ matrix.distro }}/setup.bash
        colcon build --packages-select ros_tui

    # The installed copy must carry textual itself.
    - name: Check the install uses the bundled textual
      shell: bash
      run: |
        . install/setup.bash
        cd /tmp && python3 -c "import ros_tui, textual; assert '/install/' in textual.__file__ and '_vendor' in textual.__file__, textual.__file__"

    - name: Test with pytest
      working-directory: src/ros_tui
      shell: bash
      env:
        # On pull requests the screenshot scenarios also write their shots (see docs/agentic-dev.md).
        ROS_TUI_SHOTS: ${{ github.event_name == 'pull_request' && matrix.distro == 'jazzy' && '1' || '0' }}
      run: |
        . /opt/ros/${{ matrix.distro }}/setup.bash
        python3 -m pytest

    - name: Upload UI screenshots
      if: always() && github.event_name == 'pull_request' && matrix.distro == 'jazzy'
      uses: actions/upload-artifact@v4
      with:
        name: ui-screenshots
        path: src/ros_tui/test/artifacts/
        if-no-files-found: ignore

  pyz:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build ros_tui.pyz
      run: scripts/build_pyz.sh

    - uses: actions/upload-artifact@v4
      with:
        name: ros_tui.pyz
        path: dist/ros_tui.pyz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ test, pyz ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: ros_tui.pyz

    - name: Attach ros_tui.pyz to the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" ros_tui.pyz --repo "$GITHUB_REPOSITORY" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" ros_tui.pyz --repo "$GITHUB_REPOSITORY" --clobber
