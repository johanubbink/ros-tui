name: ROS 2 Jazzy CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        apt-get update -qq
        apt-get install -y --no-install-recommends \
          ros-jazzy-example-interfaces \
          ros-jazzy-test-msgs \
          ros-jazzy-turtlesim \
          ros-jazzy-domain-coordinator \
          ros-jazzy-tf-transformations \
          python3-rich \
          python3-pytest \
          python3-pytest-asyncio \
          python3-pip \
          python3-flake8 \
          python3-venv \
          librsvg2-bin \
          fonts-jetbrains-mono

    - name: Set up virtualenv with ROS site-packages
      run: |
        python3 -m venv --system-site-packages /ci-venv
        /ci-venv/bin/pip install textual

    - name: Install package
      run: |
        . /opt/ros/jazzy/setup.sh
        /ci-venv/bin/pip install --no-deps -e .

    - name: Lint with flake8
      run: |
        python3 -m flake8 ros_tui test --count --select=E9,F63,F7,F82 --show-source --statistics
        python3 -m flake8 ros_tui test --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      env:
        # On pull requests the screenshot scenarios also write their shots (see docs/agentic-dev.md).
        ROS_TUI_SHOTS: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      run: |
        . /opt/ros/jazzy/setup.sh
        /ci-venv/bin/python -m pytest

    - name: Upload UI screenshots
      if: always() && github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: ui-screenshots
        path: test/artifacts/
        if-no-files-found: ignore
